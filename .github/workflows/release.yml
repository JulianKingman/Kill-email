name: release

# Builds kill-email for macOS, Linux and Windows on every push that touches the app.
# Branch pushes update the rolling "nightly" pre-release, which the install scripts
# (website/public/install.sh and install.ps1) download. Pushing a tag like v0.1.0
# publishes a proper release.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Combine into one binary for Apple Silicon and Intel Macs
        run: |
          mkdir -p dist
          lipo -create -output dist/kill-email \
            target/aarch64-apple-darwin/release/kill-email \
            target/x86_64-apple-darwin/release/kill-email
          cp README.md dist/
          tar -czf kill-email-macos.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: kill-email-macos
          path: app/kill-email-macos.tar.gz

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          cp target/release/kill-email README.md dist/
          tar -czf kill-email-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: kill-email-linux-x86_64
          path: app/kill-email-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/kill-email.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath kill-email-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kill-email-windows-x86_64
          path: app/kill-email-windows-x86_64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  nightly:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    concurrency: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin refs/tags/nightly
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          body: |
            The latest build of ${{ github.ref_name }} (${{ github.sha }}), replaced on every push.
            Install or update with `curl -fsSL https://killall.email/install.sh | sh`.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/*
