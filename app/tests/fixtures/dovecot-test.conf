# Throwaway Dovecot for the integration test: localhost only, one fixed password.
# Start with `dovecot -c tests/fixtures/dovecot-test.conf` (needs the `kmail` user and
# the directories created as in .github/workflows/app.yml).
protocols = imap
listen = 127.0.0.1
base_dir = /run/kedc
log_path = /var/tmp/kedc-dovecot.log
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
default_internal_user = dovecot
default_login_user = dovenull
default_internal_group = dovecot
passdb {
  driver = static
  args = password=testpass
}
userdb {
  driver = static
  args = uid=kmail gid=kmail home=/var/tmp/kedc-mail/%u
}
mail_location = maildir:~/Maildir
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
namespace inbox {
  inbox = yes
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
